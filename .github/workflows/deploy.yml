name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # manual trigger available from the Actions UI

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  # Run tests first — a failing build never reaches the VM.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Write VM SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & restart on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/uscis-checker
            git fetch --prune origin
            git reset --hard origin/main
            # One-time filename migration: pre-commit 54b5c59 used
            #   data/{num}_logs.json          (case-API snapshots)
            # and the later location-API work originally added
            #   data/{num}_location_logs.json
            # Both were renamed in-repo to {num}_case.json / {num}_location.json
            # to mirror the API names. Rename any legacy files in place so
            # the new code picks up existing history on first run. Idempotent
            # (nullglob makes empty patterns a no-op) — safe to keep across
            # future deploys.
            (
              cd data 2>/dev/null || exit 0
              shopt -s nullglob
              for f in *_location_logs.json; do
                mv -- "$f" "${f%_location_logs.json}_location.json"
              done
              for f in *_logs.json; do
                mv -- "$f" "${f%_logs.json}_case.json"
              done
            )
            # Reinstall deps only when requirements.txt changed since last deploy.
            if ! diff -q .last-requirements-hash <(sha256sum requirements.txt) >/dev/null 2>&1; then
              source venv/bin/activate
              pip install --quiet --upgrade pip
              pip install --quiet -r requirements.txt
              sha256sum requirements.txt > .last-requirements-hash
            fi
            sudo systemctl restart uscis-checker
            sleep 3
            sudo systemctl is-active uscis-checker
            # Smoke check: the login page is always open whether or not the
            # access gate is armed. A 200 here proves the server is up.
            curl -fsS --max-time 10 http://127.0.0.1:8080/login >/dev/null \
              || curl -fsS --max-time 10 http://127.0.0.1:8080/api/pull/status >/dev/null
            echo "Deploy OK: $(git rev-parse --short HEAD)"
          REMOTE
